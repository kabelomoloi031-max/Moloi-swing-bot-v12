[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moloi-swing-bot"
version = "1.0.0"
description = "AI Swing Trading Assistant for MT5 using Google Gemini AI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "kabelomoloi031-max"}
]
keywords = ["trading", "ai", "swing-trading", "mt5", "gemini", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "streamlit>=1.36.0",
    "google-generativeai>=0.3.0",
    "Pillow>=10.2.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/kabelomoloi031-max/Moloi-swing-bot-v12"
Repository = "https://github.com/kabelomoloi031-max/Moloi-swing-bot-v12"
Issues = "https://github.com/kabelomoloi031-max/Moloi-swing-bot-v12/issues"

[project.scripts]
moloi-swing-bot = "app:main"
